<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <!-- ==================== [模塊 1：網頁標頭與全域設定] ==================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>一間小店 | 收藏限時拍賣購買</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    .modal-enter { animation: fadeIn 0.2s ease-out; }
    @keyframes fadeIn { from { opacity: 0; transform: scale(0.95); } to { opacity: 1; transform: scale(1); } }
    .line-clamp-2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

  <!-- ==================== [模塊 2：頂部導航欄與狀態區] ==================== -->
  <header class="bg-white shadow-sm sticky top-0 z-30">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between gap-2">
      <div class="flex items-center space-x-2.5 cursor-pointer shrink-0" onclick="switchView('all')">
        <div class="bg-amber-500 text-white p-2 rounded-lg shadow-md">
          <i class="fa-solid fa-gavel text-lg"></i>
        </div>
        <div>
          <span class="font-bold text-lg sm:text-xl tracking-tight text-slate-900">一間小店</span>
        </div>
      </div>

      <div class="hidden md:flex flex-1 max-w-md mx-4">
        <div class="relative w-full">
          <input type="text" id="searchInput" oninput="renderAuctions()" placeholder="搜尋毛公仔、盒玩、其他收藏..." 
            class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-amber-500 bg-slate-50">
          <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-2.5 text-slate-400"></i>
        </div>
      </div>

      <!-- 右上角身份區 -->
      <div class="flex items-center space-x-2 shrink-0">
        <div id="guestAuthView" class="flex items-center space-x-2">
          <span class="inline-flex items-center px-2.5 py-1 rounded-full text-xs font-medium bg-slate-100 text-slate-600 border border-slate-200">
            <span class="w-2 h-2 rounded-full bg-emerald-500 mr-1.5"></span>訪客觀標中
          </span>
          <button onclick="openLoginModal()" class="bg-slate-900 hover:bg-slate-800 text-white text-xs sm:text-sm font-bold px-3.5 py-2 rounded-full shadow-sm transition flex items-center space-x-1.5">
            <i class="fa-brands fa-google text-rose-400"></i>
            <span>登入參與競標</span>
          </button>
        </div>

        <div id="userAuthView" class="hidden flex items-center space-x-2.5">
          <button onclick="openMessagesModal()" class="relative p-2 text-slate-600 hover:text-amber-600 hover:bg-slate-100 rounded-full transition">
            <i class="fa-regular fa-bell text-lg"></i>
            <span id="unreadMsgBadge" class="hidden absolute top-1 right-1 w-4 h-4 bg-rose-500 text-white text-[10px] font-bold rounded-full flex items-center justify-center">0</span>
          </button>

          <button id="adminUploadBtn" onclick="openUploadModal()" class="hidden bg-amber-500 hover:bg-amber-600 text-white text-xs sm:text-sm font-bold px-3.5 py-2 rounded-full shadow-sm transition flex items-center">
            <i class="fa-solid fa-plus mr-1.5"></i> 官方上架
          </button>
          
          <div class="flex items-center space-x-2 pl-2 border-l border-slate-200">
            <div id="userAvatarContainer" class="w-9 h-9 rounded-full bg-amber-100 text-amber-800 font-bold flex items-center justify-center text-sm overflow-hidden border border-amber-300">
              U
            </div>
            <div class="text-left">
              <div class="flex items-center space-x-1">
                <span id="userNameDisplay" class="text-xs font-bold text-slate-800 leading-none">載入中</span>
                <span id="userRoleBadge" class="text-[10px] px-1.5 py-0.2 rounded font-semibold"></span>
              </div>
              <div class="flex items-center space-x-2 mt-0.5">
                <button onclick="openProfileModal(false)" class="text-[11px] text-amber-600 hover:underline font-semibold"><i class="fa-solid fa-user-gear mr-0.5"></i>修改資料</button>
                <button onclick="logout()" class="text-[11px] text-rose-500 hover:underline">登出</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ==================== [模塊 3：視角與分類切換列] ==================== -->
  <div class="bg-white border-b border-slate-200">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-3 flex flex-wrap items-center justify-between gap-4">
      <div class="flex space-x-2">
        <button id="tabAll" onclick="switchView('all')" class="px-4 py-1.5 rounded-full text-sm font-medium bg-slate-900 text-white shadow-sm transition">
          <i class="fa-solid fa-fire text-amber-400 mr-1"></i> 全部拍賣場
        </button>
        <button id="tabMyBids" onclick="switchView('my_bids')" class="px-4 py-1.5 rounded-full text-sm font-medium text-slate-600 hover:bg-slate-100 transition">
          <i class="fa-solid fa-hand-holding-dollar mr-1"></i> 我的參標紀錄 <span id="myBidCountBadge" class="ml-1 px-1.5 py-0.2 text-xs rounded-full bg-slate-200 text-slate-700">0</span>
        </button>
      </div>
      <div class="flex items-center space-x-2 overflow-x-auto text-sm">
        <span class="text-slate-400 text-xs mr-1">分類:</span>
        <button onclick="setCategory('全部')" class="cat-btn px-3 py-1 rounded-md bg-amber-500 text-white font-medium" data-cat="全部">全部</button>
        <button onclick="setCategory('毛公仔')" class="cat-btn px-3 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200" data-cat="毛公仔">毛公仔</button>
        <button onclick="setCategory('盒玩')" class="cat-btn px-3 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200" data-cat="盒玩">盒玩</button>
        <button onclick="setCategory('其他')" class="cat-btn px-3 py-1 rounded-md bg-slate-100 text-slate-600 hover:bg-slate-200" data-cat="其他">其他</button>
      </div>
    </div>
  </div>

  <!-- ==================== [模塊 4：主內容網格與管理員橫幅] ==================== -->
  <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
    <div id="adminBanner" class="mb-6 hidden bg-amber-50 border border-amber-200 rounded-xl p-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-solid fa-crown text-amber-600 text-xl"></i>
        <div>
          <h3 class="text-sm font-bold text-amber-950">官方管理員模式 (is_admin = true)</h3>
          <p class="text-xs text-amber-800">可上架拍賣品、查看得標者 WhatsApp 電話，並向指定用戶發送客製化站內訊息。</p>
        </div>
      </div>
      <div class="flex space-x-2">
        <button onclick="openAdminMsgModal()" class="bg-slate-900 hover:bg-slate-800 text-white text-xs font-bold px-4 py-2 rounded-lg shadow-sm shrink-0"><i class="fa-solid fa-paper-plane mr-1"></i> 發送訊息</button>
        <button onclick="openUploadModal()" class="bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-4 py-2 rounded-lg shadow-sm shrink-0">+ 新增拍賣品</button>
      </div>
    </div>

    <!-- 拍賣品列表網格 -->
    <div id="auctionsGrid" class="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-4 gap-3 sm:gap-6"></div>

    <div id="emptyState" class="hidden text-center py-16">
      <div class="inline-flex items-center justify-center w-16 h-16 rounded-full bg-slate-100 text-slate-400 mb-4">
        <i class="fa-solid fa-gavel text-2xl"></i>
      </div>
      <h3 class="text-lg font-medium text-slate-700">暫時沒有相關拍賣品</h3>
    </div>
  </main>

  <!-- ==================== [模塊 5：站內訊息中心 Modal] ==================== -->
  <div id="messagesModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl max-w-md w-full p-6 shadow-2xl modal-enter flex flex-col max-h-[85vh]">
      <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
        <h3 class="text-base font-bold text-slate-900"><i class="fa-regular fa-bell text-amber-500 mr-2"></i>站內訊息中心</h3>
        <button onclick="document.getElementById('messagesModal').classList.add('hidden')" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <div id="messagesListContainer" class="flex-1 overflow-y-auto space-y-3 pr-1"></div>
    </div>
  </div>

  <!-- ==================== [模塊 6：管理員發送訊息 Modal] ==================== -->
  <div id="adminMsgModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl max-w-md w-full p-6 shadow-2xl modal-enter">
      <div class="flex justify-between items-center mb-3 pb-2 border-b border-slate-100">
        <h3 class="text-base font-bold text-slate-900"><i class="fa-solid fa-paper-plane text-amber-500 mr-2"></i>管理員發送站內訊息</h3>
        <button onclick="closeAdminMsgModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <form onsubmit="handleAdminSendMessage(event)" class="space-y-3">
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">目標用戶 UUID *</label>
          <input type="text" id="adminTargetUuid" required placeholder="例如：123e4567-e89b..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-xs font-mono">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">訊息上款 (預設為系統訊息，可修改)</label>
          <input type="text" id="adminSenderName" value="系統訊息" required class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm">
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">訊息內容 *</label>
          <textarea id="adminMsgContent" required rows="4" placeholder="請輸入要發送給該用戶的通知內容..." class="w-full px-3 py-2 border border-slate-300 rounded-lg text-sm"></textarea>
        </div>
        <div class="pt-2 flex justify-end space-x-2">
          <button type="button" onclick="closeAdminMsgModal()" class="px-4 py-2 rounded-lg text-xs text-slate-500">取消</button>
          <button type="submit" id="adminSendBtn" class="bg-slate-900 hover:bg-slate-800 text-white px-5 py-2 rounded-lg text-xs font-bold">確認發送</button>
        </div>
      </form>
    </div>
  </div>

  <!-- ==================== [模塊 7：登入與註冊 Modal] ==================== -->
  <div id="loginModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl max-w-sm w-full p-6 shadow-2xl modal-enter">
      <div class="flex justify-between items-center mb-2">
        <h3 class="text-lg font-bold text-slate-900">登入參與競標</h3>
        <button onclick="closeLoginModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
      </div>
      <p class="text-xs text-slate-500 mb-4">首次登入需設定顯示名稱與聯絡電話。</p>
      
      <div class="space-y-2.5">
        <button onclick="oauthLogin('google')" class="w-full flex items-center justify-center space-x-3 py-2.5 px-4 border border-slate-300 rounded-xl hover:bg-slate-50 font-medium text-sm text-slate-700">
          <i class="fa-brands fa-google text-rose-500"></i>
          <span>使用 Google 帳號繼續</span>
        </button>
      </div>

      <div class="relative flex py-4 items-center">
        <div class="flex-grow border-t border-slate-200"></div>
        <span class="flex-shrink mx-3 text-slate-400 text-[11px]">或使用 Email 快速登入/註冊</span>
        <div class="flex-grow border-t border-slate-200"></div>
      </div>

      <form onsubmit="emailQuickAuth(event)" class="space-y-2.5">
        <input type="email" id="authEmail" required placeholder="輸入 Email" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
        <input type="password" id="authPassword" required minlength="6" placeholder="輸入密碼 (至少 6 位)" class="w-full px-3 py-2 border border-slate-200 rounded-lg text-sm">
        <button type="submit" id="emailAuthBtn" class="w-full bg-slate-900 hover:bg-slate-800 text-white py-2 rounded-lg text-xs font-bold">
          Email 一鍵登入 / 自動註冊
        </button>
      </form>
    </div>
  </div>

  <!-- ==================== [模塊 8：個人資料設定 Modal] ==================== -->
  <div id="profileModal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-t-3xl sm:rounded-2xl max-w-md w-full p-6 shadow-2xl modal-enter max-h-[85vh] overflow-y-auto">
      <div class="flex items-center space-x-3 mb-3 bg-amber-50 p-3 rounded-xl border border-amber-200">
        <div class="w-10 h-10 rounded-full bg-amber-500 text-white flex items-center justify-center text-lg shrink-0">
          <i class="fa-solid fa-triangle-exclamation"></i>
        </div>
        <div>
          <h3 class="text-sm font-bold text-amber-950" id="profileModalTitle">首次登入：完善個人資料</h3>
          <p class="text-xs text-amber-800">💡 警告：用戶名稱為**必填項目**且一旦設定後將**永久無法修改**！</p>
        </div>
      </div>

      <form onsubmit="handleProfileSave(event)" class="space-y-4">
        <div class="flex items-center space-x-4">
          <div id="avatarPreviewContainer" class="w-16 h-16 rounded-full bg-slate-100 border-2 border-slate-300 overflow-hidden flex items-center justify-center text-slate-400 text-xl font-bold shrink-0">
            U
          </div>
          <div class="flex-1">
            <label class="block text-xs font-semibold text-slate-600 mb-1">上傳個人頭像 (自動壓縮優化)</label>
            <input type="file" id="avatarFileInput" accept="image/*" onchange="previewAndCompressAvatar(event)" class="w-full text-xs text-slate-500 file:mr-2 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:font-semibold file:bg-amber-50 file:text-amber-700 hover:file:bg-amber-100 cursor-pointer">
          </div>
        </div>

        <div>
          <label class="block text-xs font-semibold text-slate-600 mb-1">系統顯示名稱 <span class="text-rose-500">* (必填)</span>
